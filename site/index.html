 $("catbar").innerHTML=t.bar.map(([h,n,hl])=>`<a ${hl?'class="hl"':''} href="${L(h)}">${n}</a>`).join("");
 $("pickGrid").innerHTML=t.picks.map(([b,br,n,d,p,u,g])=>`<div class="pk"><span class="bd2">${b}</span><div class="br">${br}</div><h3>${n}</h3><p>${d}</p><div class="ft2"><span class="pr">${p}</span><a class="go2" href="${u}">${g||t.go2} →</a></div></div>`).join("");
 $("calcGrid").innerHTML=t.calcs.map(([k,h,p,b])=>`<a class="calc" href="${LINKS[k]}" target="_blank" rel="noopener">${b?`<span class="badge">${b}</span>`:""}<div class="ph" style="background-image:url(/assets/img/c-${k}.webp)"></div><div class="ic">${ICONS[k]}</div><h3>${h}</h3><p>${p}</p><span class="go">${t.go}</span></a>`).join("");
 $("catGrid").innerHTML=t.cats.map(([n,h,p],i)=>`<a class="cat c${i+1}" href="${GUIDE[i]}"><span class="n">${n}</span><h3>${h}</h3><p>${p}</p></a>`).join("");
 $("postGrid").innerHTML=POSTS.slice(0,6).map(p=>`<${p.u?'a':'div'} class="post" ${p.u?`href="${p.u}" target="_blank" rel="noopener"`:''}><div class="th" style="background:linear-gradient(140deg,${p.c},#0a1c29)"><span>${t.catName[p.cat]}</span></div><div class="bd"><h4>${p[lang]}</h4><p>${lang==="ko"?p.dko:p.den}</p><div class="meta"><span>EasySwingPick</span><span class="soon">${p.u?t.read:t.soon}</span></div></div></${p.u?'a':'div'}>`).join("");
 $("whyGrid").innerHTML=t.why.map(([k,h,p])=>`<div class="wy"><div class="k">${k}</div><h4>${h}</h4><p>${p}</p></div>`).join("");
 const fl=(arr,hrefs)=>arr.map((x,i)=>`<a href="${hrefs[i]}" ${hrefs[i].startsWith("http")?'target="_blank" rel="noopener"':''}>${x}</a>`).join("");
 $("fCalcL").innerHTML=fl(t.fCalcL,[LINKS.driver,LINKS.iron,LINKS.wedge,LINKS.putter]);
 $("fGuideL").innerHTML=fl(t.fGuideL,GUIDE);
 $("fInfoL").innerHTML=fl(t.fInfoL,["#about","#top","#about","#about"]);
}
$("langT").onclick=e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.lang;document.querySelectorAll("#langT button").forEach(x=>x.classList.toggle("on",x===b));render();};
$("burger").onclick=()=>$("mnav").classList.toggle("open");
$("mnav").onclick=e=>{if(e.target.tagName==="A")$("mnav").classList.remove("open");};

// hero gauge demo (loops gently)
const G={cx:150,cy:150,R:118,min:50,max:125};
const ang=v=>Math.PI*(1-(Math.min(G.max,Math.max(G.min,v))-G.min)/(G.max-G.min));
const pt=(v,r)=>[G.cx+r*Math.cos(ang(v)),G.cy-r*Math.sin(ang(v))];
(function build(){
 const L=Math.PI*G.R,[lx,ly]=pt(G.min,G.R),[rx,ry]=pt(G.max,G.R),arc=`M${lx} ${ly} A${G.R} ${G.R} 0 0 1 ${rx} ${ry}`;
 let tk="";for(let v=50;v<=125;v+=5){const maj=v%10===0;const[a,b]=pt(v,G.R-11),[c,d]=pt(v,G.R-(maj?22:16));tk+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="rgba(255,255,255,${maj?.5:.2})" stroke-width="${maj?1.5:1}"/>`;}
 const lab=[["L",61],["A",77],["R",87],["S",97],["X",113]].map(([l,v])=>{const[x,y]=pt(v,G.R+18);return `<text id="hl-${l}" x="${x}" y="${y+4}" font-size="11" text-anchor="middle" font-weight="700" font-family="Inter" fill="rgba(255,255,255,.4)">${l}</text>`;}).join("");
 $("hgsvg").innerHTML=`<defs><linearGradient id="hgg" gradientUnits="userSpaceOnUse" x1="${lx}" x2="${rx}" y1="0" y2="0"><stop offset="0" stop-color="#1f7a57"/><stop offset=".55" stop-color="#3fb984"/><stop offset="1" stop-color="#e3c06a"/></linearGradient><filter id="hb"><feGaussianBlur stdDeviation="4"/></filter></defs>
  <path d="${arc}" stroke="rgba(255,255,255,.08)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path id="hpb" d="${arc}" stroke="url(#hgg)" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#hb)" opacity=".5" stroke-dasharray="${L} ${L}" stroke-dashoffset="${L}"/>
  <path id="hpa" d="${arc}" stroke="url(#hgg)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${L} ${L}" stroke-dashoffset="${L}"/>
  ${tk}${lab}
  <g id="hn" transform="rotate(-90 ${G.cx} ${G.cy})"><polygon points="${G.cx-3},${G.cy} ${G.cx-.5},${G.cy-92} ${G.cx+.5},${G.cy-92} ${G.cx+3},${G.cy} ${G.cx},${G.cy+14}" fill="#f4f7f9"/></g>
  <circle cx="${G.cx}" cy="${G.cy}" r="10" fill="#0b1f2e" stroke="#c89b3c" stroke-width="2"/><circle cx="${G.cx}" cy="${G.cy}" r="3" fill="#c89b3c"/>`;
})();
const flexOf=s=>s<72?"L":s<82?"A":s<92?"R":s<102?"S":"X";
function setG(v){const L=Math.PI*G.R,f=(Math.min(G.max,Math.max(G.min,v))-G.min)/(G.max-G.min);
 $("hn").setAttribute("transform",`rotate(${90-ang(v)*180/Math.PI} ${G.cx} ${G.cy})`);
 $("hpa").setAttribute("stroke-dashoffset",L*(1-f));$("hpb").setAttribute("stroke-dashoffset",L*(1-f));
 $("hgn").textContent=Math.round(v);const fx=flexOf(Math.max(v,1));$("hgf").textContent=fx;
 ["L","A","R","S","X"].forEach(l=>{const e=$("hl-"+l);e.setAttribute("fill",l===fx?"#fff":"rgba(255,255,255,.4)");});}
function loop(){
 const target=96,t0=performance.now(),d=1800;
 if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches){setG(target);return;}
 const step=()=>{const p=Math.min(1,(performance.now()-t0)/d),e=1-Math.pow(1-p,3);setG(target*1.03*e - (p>.85?target*.03*((p-.85)/.15):0));
  if(p<1)setTimeout(step,16);else{setG(target);setTimeout(()=>{setG(0);setTimeout(loop,500);},3500);}};
 step();
}
render();setG(0);setTimeout(loop,600);
</script>
