<style>
:root{--navy:#0f2a3d;--navy-2:#173b55;--ink:#15212b;--muted:#64727d;--line:#e3e8ec;--bg:#f5f7f8;--green:#178a5b;--green-l:#e6f4ee;--gold:#c89b3c;--gold-l:#fbf4e4;--red:#7a1f2b}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,"Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:var(--green)}
header{position:sticky;top:0;z-index:20;background:rgba(15,42,61,.96);color:#fff}
.hd{max-width:1080px;margin:0 auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between;height:58px;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:#fff;text-decoration:none}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.lang button{white-space:nowrap;border:0;background:transparent;color:#fff;opacity:.75;font:inherit;font-size:.8rem;padding:5px 11px;border-radius:999px;cursor:pointer}
.lang button.on{background:#fff;color:var(--navy);opacity:1;font-weight:600}
.hero{background:radial-gradient(120% 120% at 80% 0%,#5a1a24 0%,#2b0d13 60%,#170609 100%);color:#fff;padding:44px 0 50px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.crumb{font-size:.8rem;opacity:.7}.crumb a{color:#fff}
.cat{display:inline-block;margin-top:14px;font-size:.72rem;font-weight:700;letter-spacing:.8px;background:rgba(227,192,106,.15);color:#e3c06a;border:1px solid rgba(227,192,106,.3);border-radius:999px;padding:4px 11px}
.hero h1{font-size:2rem;line-height:1.3;margin:12px 0 12px;letter-spacing:-.4px}
.hero .sub{opacity:.85;margin:0}
.meta{margin-top:16px;font-size:.82rem;opacity:.7}
.disc{background:var(--gold-l);color:#7a5a12;border-radius:10px;padding:10px 14px;font-size:.84rem;margin:24px 0 0;line-height:1.6}
article{padding:10px 0 50px}
article h2{font-size:1.4rem;margin:42px 0 12px;letter-spacing:-.2px;padding-top:6px}
article h3{font-size:1.1rem;margin:26px 0 8px}
article p{margin:0 0 14px}
article ul,article ol{padding-left:22px;margin:0 0 16px}article li{margin-bottom:6px}
.tldr{background:var(--navy);color:#fff;border-radius:16px;padding:20px 22px;margin:26px 0 8px}
.tldr b{display:block;color:#e3c06a;font-size:.78rem;letter-spacing:1px;margin-bottom:8px}
.tldr ul{margin:0;padding-left:20px}.tldr li{margin-bottom:6px}
.note{background:var(--green-l);border-left:4px solid var(--green);border-radius:10px;padding:12px 16px;margin:16px 0;font-size:.95rem}
.warn{background:#fdecee;border-left:4px solid #c8102e;border-radius:10px;padding:12px 16px;margin:16px 0;font-size:.95rem}
.tw{overflow-x:auto;margin:16px 0 8px;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:.88rem}
th,td{padding:11px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
thead th{background:var(--bg);font-size:.78rem;color:var(--muted);letter-spacing:.3px}
tbody tr:last-child td{border-bottom:0}
td b{color:var(--navy)}
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}
.pc{border:1px solid var(--line);border-radius:14px;padding:16px}
.pc .w{font-size:.75rem;font-weight:700;color:var(--green);letter-spacing:.5px}
.pc h4{margin:4px 0 6px;font-size:1.02rem}.pc p{margin:0;font-size:.9rem;color:var(--muted)}
.buy{display:inline-block;margin-top:10px;font-size:.85rem;font-weight:700;color:#fff;background:var(--navy);border-radius:8px;padding:8px 12px;text-decoration:none}
.check{list-style:none;padding:0}.check li{padding-left:30px;position:relative;margin-bottom:10px}
.check li:before{content:"✓";position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--green-l);color:var(--green);font-weight:800;font-size:.75rem;display:grid;place-items:center}
.cta{background:radial-gradient(120% 120% at 80% 0%,#21506d,#0f2a3d);color:#fff;border-radius:18px;padding:24px;margin:36px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.cta h3{margin:0 0 4px;color:#fff}.cta p{margin:0;opacity:.8;font-size:.92rem}
.cta a{background:var(--green);color:#fff;text-decoration:none;font-weight:700;border-radius:10px;padding:12px 16px;white-space:nowrap}
.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);margin-top:34px;padding-top:16px}
.src ol{padding-left:18px}.src a{color:var(--muted)}
footer{background:#0a1c29;color:rgba(255,255,255,.6);font-size:.8rem;padding:24px 0;text-align:center;line-height:1.7}
[data-l="en"]{display:none}
html[lang="en"] [data-l="ko"]{display:none}html[lang="en"] [data-l="en"]{display:block}
html[lang="en"] span[data-l="en"],html[lang="en"] b[data-l="en"]{display:inline}
@media (max-width:600px){.hero h1{font-size:1.55rem}.pick{grid-template-columns:1fr}article h2{font-size:1.25rem}}
</style>
