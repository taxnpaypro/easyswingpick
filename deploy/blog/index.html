<style>
:root{--navy:#0f2a3d;--navy-2:#173b55;--ink:#15212b;--muted:#64727d;--line:#e3e8ec;--bg:#f5f7f8;--green:#178a5b;--green-l:#e6f4ee;--gold:#c89b3c;--gold-l:#fbf4e4;--red:#7a1f2b}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,"Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.75;-webkit-font-smoothing:antialiased}

.lang button.on{background:#fff;color:var(--navy);opacity:1;font-weight:600}
.hero{background:radial-gradient(120% 120% at 80% 0%,#5a1a24 0%,#2b0d13 60%,#170609 100%);color:#fff;padding:44px 0 50px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.crumb{font-size:.8rem;opacity:.7}.crumb a{color:#fff}
.cat{display:inline-block;margin-top:14px;font-size:.72rem;font-weight:700;letter-spacing:.8px;background:rgba(227,192,106,.15);color:#e3c06a;border:1px solid rgba(227,192,106,.3);border-radius:999px;padding:4px 11px}

article h2{font-size:1.4rem;margin:42px 0 12px;letter-spacing:-.2px;padding-top:6px}

th,td{padding:11px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}

tbody tr:last-child td{border-bottom:0}

.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}
.pc{border:1px solid var(--line);border-radius:14px;padding:16px}

.check{list-style:none;padding:0}.check li{padding-left:30px;position:relative;margin-bottom:10px}
.check li:before{content:"✓";position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--green-l);color:var(--green);font-weight:800;font-size:.75rem;display:grid;place-items:center}

.src{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);margin-top:34px;padding-top:16px}
.src ol{padding-left:18px}.src a{color:var(--muted)}
