  const finish=()=>{setPend(HDEG[hang]);st.textContent=t.gDone;st.classList.add("ok");pill.classList.add("done");};
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches){finish();return;}
  const pos=dx=>[SP.x0+dx,SP.y0+k*dx*dx,Math.atan(2*k*dx)*180/Math.PI];
  const seg=[[0,-62,900],[-62,70,700]];const pts=[];let si=0,t0=null,ballGo=null;
  const eio=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
  const step=()=>{if(id!==animId)return;const now=performance.now();if(t0===null)t0=now;
    const [a,b,d]=seg[si];const p=Math.min(1,(now-t0)/d),dx=a+(b-a)*(si===0?eio(p):p*p*(3-2*p));
    const [x,y,ang]=pos(dx);head.setAttribute("transform",`translate(${x} ${y}) rotate(${ang})`);
    pts.push(`${x},${y}`);const s=pts.join(" ");trail.setAttribute("points",s);trailG.setAttribute("points",s);
    if(si===1&&!ballGo&&x>=SP.ball-6)ballGo=now;
    if(ballGo){const bp=Math.min(1,(now-ballGo)/1100),e=1-Math.pow(1-bp,3);ball.setAttribute("cx",SP.ball+(282-SP.ball)*e);ball.setAttribute("opacity",1-bp*.6);}
    if(p>=1){si++;t0=null;if(si>=seg.length){setTimeout(()=>pendulum(id,hang,finish),350);return;}}
    setTimeout(step,16);};
  setPend(70);setTimeout(step,500);
}
function pendulum(id,hang,finish){
  const target=HDEG[hang],t0=performance.now(),A=70-target;
  const step=()=>{if(id!==animId)return;const s=(performance.now()-t0)/1000;
    const v=target+A*Math.exp(-2.6*s)*Math.cos(7.5*s);setPend(v);
    if(s<1.9)setTimeout(step,16);else finish();};
  step();
}

// Guardrail: after scoring, drop combinations that should never be recommended (fallback only if fewer than 3 remain)
const guard=(arr,ok)=>{const g=arr.filter(ok);if(g.length>=3)return g.slice(0,3);const lo=g.length?g[g.length-1].sc-1:Infinity;return[...g,...arr.filter(o=>!ok(o)).map(o=>({...o,sc:Math.min(o.sc,lo)}))].slice(0,3);};
function run(silent){
  const t=T[lang],R=t.r,err=$("err");
  if(!stroke){if(!silent){err.textContent=t.errStroke;err.style.display="block";}return;}
  err.style.display="none";
  const sk=stroke==="unk"?"slight":stroke,age=num("age"),senior=age&&age>=60;
  const ft=num("hft"),inch=Math.min(11,Math.max(0,parseFloat($("hin").value)||0)),hTot=ft?ft*12+inch:null,brand=$("brand").value;
  const why=[R[stroke==="unk"?"unk":sk]];
  if(stroke==="unk")why.push(R.slight);
  const wantZT=(miss==="short")||((miss==="push"||miss==="pull")&&sk!=="strong");
  let hang=sk==="straight"?(wantZT||miss==="short"?"zt":"fb"):sk==="slight"?(miss==="short"?"zt":"slight"):"strong";
  if(sk==="strong"&&miss==="short")why.push(R.ztNo);else if(miss&&R[miss])why.push(R[miss]);
  let shape=headp&&headp!=="any"?headp:(sk==="straight"?"mallet":sk==="slight"?"mid":"blade");
  if(!headp&&(hcp==="h3"||senior)&&shape!=="mallet"&&sk!=="strong"){shape="mallet";why.push(R.forg);}
  // length
  let len=34;if(hTot){len=hTot<66?33:hTot<72?34:hTot<75?35:35.5;}
  if(posture==="bent")len-=1;if(posture==="up")len+=1;len=Math.max(32,Math.min(36,len));
  const lenTxt=`${len}"`;
  why.push(hTot?R.len(`${Math.floor(hTot/12)}'${Math.round(hTot%12)}"`,lenTxt):len!==34?R.lenPost(lenTxt):R.lenNone);
  const grip=gripp||((miss==="pull"||miss==="short")?"fat":"std");
  if(miss==="pull"||miss==="short"){if(grip==="fat")why.push(R.gripFat);else why.push(R.gripTry);}
  const align=alignp||((miss==="push"||miss==="pull")?"multi":"single");
  if(brand)why.push(R.brand(brand==="other"?(lang==="ko"?"기타 브랜드":"another brand"):brand));
  // models
  const scored=guard(MODELS.map(m=>{let sc=0;
    const mh=m.hang==="lt"?"lt":m.hang;
    if(hang==="zt")sc+=mh==="zt"?40:mh==="lt"?25:mh==="fb"?18:-15;
    else if(hang==="fb")sc+=mh==="fb"?40:mh==="zt"?(wantZT?32:26):mh==="lt"?24:mh==="slight"?8:-20;
    else if(hang==="slight")sc+=mh==="slight"?40:mh==="lt"?24:mh==="fb"?12:mh==="strong"?12:mh==="zt"?6:0;
    else sc+=mh==="strong"?40:mh==="slight"?14:mh==="zt"?-25:-15;
    if(m.shape===shape)sc+=headp&&headp!=="any"?18:10;
    if(hcp==="h2"||hcp==="h3"||senior)sc+=m.forg*5;
    if(miss==="dist"&&m.pace)sc+=10; if(miss==="dist"&&m.milled)sc+=4;
    if(m.align===align)sc+=4; if(hcp==="h0"&&m.milled)sc+=4;
    return{m,sc};}).sort((a,b)=>b.sc-a.sc),o=>!(hang==="strong"&&o.m.hang==="zt")&&!((hang==="zt"||hang==="fb")&&o.m.hang==="strong"));
  if(headp&&headp!=="any"&&!scored.some(o=>o.m.shape===shape))why.push(R.shapeFew(t.hs[shape]));
  const topS=scored[0].sc,pct=sc=>Math.max(55,Math.min(97,Math.round(93-(topS-sc)*.8)));
  const picks=scored.map(({m,sc},i)=>{const r=[];
    if(m.hang===hang||(hang==="fb"&&m.hang==="zt")||(m.hang==="lt"&&hang!=="strong"))r.push(m.hang==="zt"?R.ztOk:R.hangOk(t.hang[hang]));
    if(m.shape===shape&&headp&&headp!=="any")r.push(R.headOk);
    if(m.forg===2)r.push(R.forgOk); if(m.pace)r.push(R.paceOk); if(m.jp)r.push(R.jpOk);
    const tags=[m.hang==="zt"&&t.tg.zt,m.hang==="lt"&&t.tg.lt,m.forg===2&&t.tg.forg,m.milled&&t.tg.milled,m.jp&&t.tg.jp,m.align==="multi"&&t.tg.align,m.pace&&t.tg.pace].filter(Boolean);
    const p=pct(sc);
    return `<div class="card pick ${i===0?'top1':''}">
      <div class="ph"><div><span class="rank ${i?'s':''}">${t.rank(i+1)}</span><div class="brand">${m.b} · ${t.hs[m.shape]}</div><div class="model">${m.m}</div></div>
      <div class="score"><b>${p}%</b><span>${t.fit}</span></div></div>
      <div class="meter"><div style="width:${p}%"></div></div>
      <div class="tags">${tags.map(x=>`<span>${x}</span>`).join("")}</div>
      <p class="point">${m.p[lang]}</p>
      <ul class="why">${r.map(x=>`<li>${x}</li>`).join("")}</ul>
      <a class="buy" href="${AFF(m.b+' '+m.m)}" target="_blank" rel="sponsored noopener">${t.buy}</a></div>`;}).join("");
  const res=$("result");
  res.innerHTML=`<div class="disc">${t.disclose}</div>${!miss?`<div class="hint">${t.hintMiss}</div>`:""}
   <div class="card gcard"><div class="gtop"><span class="gsec">${t.pathT}</span><span class="gstat ${silent?'ok':''}" id="gs">${silent?t.gDone:t.gBusy}</span></div>
    ${strokeSvg(Kof[sk],shape,t.target)}
    <div class="sublab">${t.hangT}</div>${hangSvg()}
    <div class="hangval" id="hv">${silent?HDEG[hang]:70}°<small>toe hang</small></div>
    <div class="ctr"><div class="fp ${silent?'done':''}" id="gp"><span>${t.hangLab}</span><b style="width:auto;padding:0 12px;border-radius:999px;font-size:.92rem">${t.hang[hang]}</b></div></div></div>
   <div class="card"><h2>${t.setT}</h2>
    <div class="specs">
     <div class="spec"><span>${t.hL}</span><b>${t.hang[hang]}</b></div><div class="spec"><span>${t.shL}</span><b>${t.hs[shape]}</b></div><div class="spec"><span>${t.lenL}</span><b>${lenTxt}</b></div>
     <div class="spec"><span>${t.gripL}</span><b>${t.gp[grip]}</b></div><div class="spec"><span>${t.alL}</span><b>${t.al[align]}</b></div><div class="spec"><span>Toe hang</span><b>${hang==="zt"?"0° (ZT)":HDEG[hang]===0?"0°":hang==="slight"?"15~35°":"40°+"}</b></div>
    </div>
    <div class="sec">${t.whyT}</div><ul class="why">${why.map(x=>`<li>${x}</li>`).join("")}</ul></div>
   <h2 style="margin:20px 4px 12px">${t.picksT}</h2>${picks}`;
  res.style.display="block";
  if(silent){animId++;setPend(HDEG[hang]);const [x,y,a]=[SP.x0+70,SP.y0+Kof[sk]*4900,Math.atan(2*Kof[sk]*70)*180/Math.PI];$("phead").setAttribute("transform",`translate(${x} ${y}) rotate(${a})`);
    const pts=[];for(let dx=-62;dx<=70;dx+=2)pts.push(`${SP.x0+dx},${SP.y0+Kof[sk]*dx*dx}`);$("trail").setAttribute("points",pts.join(" "));$("trailG").setAttribute("points",pts.join(" "));$("ball").setAttribute("cx",282);$("ball").setAttribute("opacity",.4);}
  else{res.scrollIntoView({behavior:"smooth",block:"start"});animate(Kof[sk],shape,hang);}
}
render();
</script>

 en:{t:"Top 5 by age · Putter",s:"Enter your age and your group is selected automatically.",g:["Under 45","45–64","65+"],you:"Your pick",

 const L=(typeof lang!=="undefined"?lang:"ko"),t=AGT[L],k=["u45","m45","s65"][ag],res=picked(),box=document.getElementById("ageTop");if(!box)return;
 box.innerHTML=`<div class="card agw"><h2>${t.t}</h2><p class="ags">${t.s}</p>
