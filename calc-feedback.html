<!-- Injected into every calculator by build_deploy.py: "이 추천이 이상한가요?" feedback box under the result -->
<style>
#fbBox{display:none;margin:18px 0 8px;padding:16px 18px;border:1px dashed #c9d3da;border-radius:14px;background:#fafbfc}
#fbBox .fbq{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font-weight:700;color:#0f2a3d;font-size:.95rem}
#fbBox .fbq span{font-size:.8rem;font-weight:600;color:#64727d;white-space:nowrap}
#fbBox .fbb{display:none;margin-top:12px}
#fbBox.open .fbb{display:block}
#fbBox p{margin:0 0 10px;color:#64727d;font-size:.85rem;line-height:1.5}
#fbBox .fbr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
#fbBox .fbr button{border:1px solid #d5dde3;background:#fff;border-radius:999px;padding:7px 12px;font:inherit;font-size:.82rem;color:#15212b;cursor:pointer}
#fbBox .fbr button.on{background:#0f2a3d;border-color:#0f2a3d;color:#fff}
#fbBox textarea{width:100%;box-sizing:border-box;min-height:64px;border:1px solid #d5dde3;border-radius:10px;padding:9px 11px;font:inherit;font-size:.88rem;resize:vertical}
#fbBox .fbs{margin-top:10px;width:100%;border:0;border-radius:10px;padding:11px;background:#c89b3c;color:#fff;font:inherit;font-weight:700;cursor:pointer}
#fbBox .fbok{display:none;margin-top:10px;color:#178a5b;font-size:.85rem;font-weight:600}
</style>
<div id="fbBox" role="region" aria-label="feedback">
  <div class="fbq" id="fbQ"><b id="fbT"></b><span id="fbOpen"></span></div>
  <div class="fbb">
    <p id="fbD"></p>
    <div class="fbr" id="fbR"></div>
    <textarea id="fbC"></textarea>
    <button type="button" class="fbs" id="fbS"></button>
    <div class="fbok" id="fbOk"></div>
  </div>
</div>
<script>
(function(){
var TO="hello@easyswingpick.com";
var T={ko:{q:"이 추천이 이상한가요?",open:"알려 주기 ▾",d:"입력하신 값과 결과가 함께 전달됩니다. 확인 후 바로 고치겠습니다. 이름이나 연락처는 보내지 않습니다.",
  r:["결과가 반대 같아요","무게·강도가 안 맞는 것 같아요","제 실력·나이에 안 맞아요","설명과 표가 달라요","기타"],c:"추가로 알려 주실 내용 (선택)",s:"메일로 보내기",
  ok:"메일 앱이 열렸습니다. 보내기를 눌러 주시면 됩니다. 감사합니다!",sub:"[계산기 오류 신고]",inL:"입력값",outL:"결과",whyL:"신고 사유",cL:"내용"},
 en:{q:"Does this recommendation look wrong?",open:"Tell us ▾",d:"Your inputs and result are included so we can check and fix it. No name or contact details are sent.",
  r:["It looks backwards","Weight or flex seems off","Doesn't fit my level or age","Text and table disagree","Other"],c:"Anything else? (optional)",s:"Send by email",
  ok:"Your mail app opened. Just press send. Thank you!",sub:"[Calculator report]",inL:"Inputs",outL:"Result",whyL:"Reason",cL:"Note"}};
var box=document.getElementById("fbBox"),res=document.getElementById("result");if(!box||!res)return;
res.parentNode.insertBefore(box,res.nextSibling);
function L(){var b=document.querySelector("#langT button.on");return b&&b.dataset.lang==="en"?"en":"ko";}
var sel=-1;
function paint(){var t=T[L()];
  document.getElementById("fbT").textContent=t.q;document.getElementById("fbOpen").textContent=t.open;
  document.getElementById("fbD").textContent=t.d;document.getElementById("fbC").placeholder=t.c;
  document.getElementById("fbS").textContent=t.s;document.getElementById("fbOk").textContent=t.ok;
  document.getElementById("fbR").innerHTML=t.r.map(function(x,i){return '<button type="button" data-i="'+i+'" class="'+(i===sel?"on":"")+'">'+x+"</button>";}).join("");}
document.getElementById("fbQ").onclick=function(){box.classList.toggle("open");};
document.getElementById("fbR").onclick=function(e){var b=e.target.closest("button");if(!b)return;sel=+b.dataset.i;paint();};
function inputs(){var out=[],f=document.getElementById("f");if(!f)return"";
  f.querySelectorAll("input[type=number]").forEach(function(e){if(e.value==="")return;var l=f.querySelector('label[for="'+e.id+'"]');out.push((l?l.textContent:e.id)+": "+e.value);});
  f.querySelectorAll(".chips").forEach(function(c){var on=c.querySelector("button.on");if(!on)return;var fld=c.closest(".f")||c.parentNode,lab=fld.querySelector(".lab span, .lab label");out.push((lab?lab.textContent:c.id)+": "+on.textContent);});
  f.querySelectorAll("select").forEach(function(e){if(e.value)out.push(e.id+": "+e.options[e.selectedIndex].text);});
  return out.join("\n");}
function result(){var t=res.innerText.split("\n").map(function(x){return x.trim();}).filter(Boolean);
  t=t.filter(function(x){return x.indexOf("제휴")<0&&x.indexOf("affiliate")<0&&x.indexOf("2nd Swing")<0&&!/^\d+°?$/.test(x)&&!/^[LARSX]$/.test(x);});
  return t.join(" | ").slice(0,1200);}
document.getElementById("fbS").onclick=function(){var t=T[L()];
  var body=t.whyL+": "+(sel>=0?t.r[sel]:"-")+"\n"+t.cL+": "+(document.getElementById("fbC").value||"-")+"\n\n"+t.inL+":\n"+inputs()+"\n\n"+t.outL+":\n"+result()+"\n\n"+location.href+" ("+L()+")";
  var url="mailto:"+TO+"?subject="+encodeURIComponent(t.sub+" "+document.title)+"&body="+encodeURIComponent(body);box.dataset.last=url;location.href=url;
  document.getElementById("fbOk").style.display="block";};
function vis(){box.style.display=res.innerHTML.trim()&&res.style.display!=="none"?"block":"none";}
new MutationObserver(vis).observe(res,{childList:true,subtree:false,attributes:true});
var lt=document.getElementById("langT");if(lt)lt.addEventListener("click",function(){setTimeout(paint,0);});
paint();vis();
})();
</script>
